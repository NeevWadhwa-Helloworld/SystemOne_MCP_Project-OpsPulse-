# NOTE: This project is now deployed FREE on Railway (see railway.json + DEPLOYMENT.md).
# Render's free tier does NOT include persistent disk — adding a disk costs $7+/month.
# Railway includes a free persistent volume — no disk fee.
#
# This file is kept for reference only. Use railway.json for deployment.

services:
  - type: web
    name: opspulse-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # disk section removed — use Railway free volume instead (see DEPLOYMENT.md)
    envVars:
      - key: OPSPULSE_DB_PATH
        value: /var/data/opspulse.db
      - key: BIND_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false
      - key: APP_MASTER_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini/gemini-2.0-flash
      - key: MONITOR_ALERT_COOLDOWN_SECONDS
        value: "300"
